# Local build/test stack. The application image is built from this repository; Docker Compose does
# not pull a viveCServer image from Docker Hub.
#
#   docker compose -f deploy/docker-compose.yml up --build -d
#   open http://localhost:8080
#
# PostgreSQL is private to this Compose network. VIVE_POSTGRES_PASSWORD can override the local-only
# default; keep it URL-safe because it is interpolated into VIVE_DATABASE_URL below.

name: vivecserver

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: vive
      POSTGRES_DB: vive
      POSTGRES_PASSWORD: ${VIVE_POSTGRES_PASSWORD:-vive-local-only}
    volumes:
      - ./data/postgres:/var/lib/postgresql:Z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vive -d vive']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  vivecserver:
    image: vivecserver:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    pull_policy: build

    user: '1000:1000'

    environment:
      VIVE_DATABASE_URL: postgres://vive:${VIVE_POSTGRES_PASSWORD:-vive-local-only}@postgres:5432/vive?sslmode=disable
      VIVE_ADMIN_LISTEN_ADDR: ':8080'
      VIVE_SYNC_LISTEN_ADDR: ':8281'
      VIVE_LOG_LEVEL: ${VIVE_LOG_LEVEL:-info}
    volumes:
      # have to run this sudo because docker if fucking retarded
      # sudo chown -R 1000:1000 deploy/data/blobs
      - ./data/blobs:/var/lib/vivecserver/blobs:Z
    ports:
      - '${VIVE_ADMIN_PORT:-8080}:8080'
      - '${VIVE_SYNC_PORT:-5444}:8281'
    # The server migrates on startup, so it must not race PostgreSQL's first boot. Waiting for
    # healthy rather than started is the difference between a clean `up` and one that fails on the
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped
