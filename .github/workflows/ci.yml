name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Formatting is checked rather than applied: a CI job that rewrites source hides the fact
      # that someone's editor is not set up.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race because every bug this server is likely to have is a concurrency bug: the sequence
      # allocation of SD2 and the batch application of S3 are both about what two writers do at once.
      - name: go test
        run: go test -race ./...
