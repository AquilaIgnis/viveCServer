name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The integration suite runs against a real PostgreSQL, not a fake. What it checks — that a
    # sequence value is allocated exactly once under concurrent pushes, and that a reader never
    # steps over a change — is as much a property of PostgreSQL's locking as of this code, so a
    # substitute would only prove that the substitute agrees with itself.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Formatting is checked rather than applied: a CI job that rewrites source hides the fact
      # that someone's editor is not set up.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race because every bug this server is likely to have is a concurrency bug: the sequence
      # allocation of SD2 and the batch application of S3 are both about what two writers do at once.
      #
      # VIVE_TEST_DATABASE_URL is what makes ./tests run rather than skip. The suite refuses to skip
      # when CI is set — which Actions sets for us — so a broken service container fails the job
      # instead of quietly reducing it to the unit tests.
      - name: go test
        env:
          VIVE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race ./...
