openapi: 3.1.2

info:
  title: Vive Notes Community Server API
  version: 0.5.0
  summary: Device authentication and notebook synchronisation API for viveNotes.
  description: |
    This document describes the API currently implemented on viveCServer's sync listener
    (container port 8281, host port 5444 in the supplied Compose deployment).

    The browser setup and administration interface on port 8080 is intentionally not part of this
    API. A server owner creates the first account there. A viveNotes client then calls
    `POST /v1/devices` once with the account credentials and stores the returned device token.
    Subsequent authenticated requests use that token as a Bearer credential.

    Synchronisation covers the notebook, section, and page hierarchy. A client keeps one cursor per
    account, polls `GET /v1/cursor`, pulls with `GET /v1/changes` when it has moved, and pushes its
    own edits with `POST /v1/changes`. Concurrency is optimistic: every entity carries a
    server-assigned `version`, a push states the version it believes it is editing, and a push that
    lost the race comes back with the current server state rather than overwriting it.

    Document bodies are the `pageContent` kind (S3): opaque bytes with a codec id and a checksum,
    which the server stores and returns without ever parsing.

    Ink is three more kinds (S4), all hanging from a page: `inkStroke`, and the two replayable
    operations `inkErase` and `inkMove`. Their points are opaque bytes with an encoder id, the way a
    document body is, and each operation carries the ids of the strokes it affected inside itself.
    Ink conflicts are rare by construction rather than by rule — two devices never write the same
    stroke id — so it takes the same optimistic concurrency path as everything else.

    Attachment bytes (S5) are addressed by content, at `/v1/blobs/{sha256}`, and are the one part of
    a notebook that does not travel through the change protocol. Upload the bytes first, then push
    the `attachment` row and the `pageContent` whose `blobRefs` name them: a change referencing a
    digest the server does not hold is rejected `missing_blob`, so the server can never hold a
    reference to bytes it cannot serve. Ask `HEAD /v1/blobs/{sha256}` before every upload — the same
    picture on a second device is then one round trip rather than a second copy of the file.

servers:
  - url: http://localhost:5444
    description: Server running on the same computer as the API caller.
  - url: http://10.0.2.2:5444
    description: Host computer as reached from the standard Android Emulator.

tags:
  - name: Health
    description: Process and PostgreSQL availability probes.
  - name: Accounts
    description: Optional public account registration. Closed by default.
  - name: Devices
    description: Device registration, authentication, listing, and revocation.
  - name: Sync
    description: Cursor, change pull, and change push for the notebook hierarchy.
  - name: Attachments
    description: Content-addressed attachment bytes, uploaded before the changes that reference them.

paths:
  /healthz:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Check whether the server process is running
      description: This probe does not access PostgreSQL and remains healthy during a database outage.
      security: []
      responses:
        "200":
          description: The server process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthyStatus"
              example:
                status: ok

  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Check whether the server can reach PostgreSQL
      security: []
      responses:
        "200":
          description: The server and PostgreSQL are ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthyStatus"
              example:
                status: ok
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableStatus"
              example:
                status: unavailable
                reason: database

  /v1/accounts:
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create an account when public registration is enabled
      description: |
        This endpoint returns `403 signup_closed` under the default `VIVE_SIGNUP_MODE=closed`
        configuration. Self-hosted users normally create the first account through the browser
        setup wizard on port 8080, not through this operation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
            example:
              email: owner@example.com
              password: correct horse battery staple
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          description: Public account registration is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: signup_closed
                message: this server does not accept registrations; the operator creates accounts with the create-account command
        "409":
          description: An account already uses the submitted email address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: email_taken
                message: an account already exists for that email address
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/devices:
    post:
      operationId: registerDevice
      tags: [Devices]
      summary: Exchange account credentials for a device token
      description: |
        Call this once when connecting a viveNotes installation to the server. The plaintext device
        token is returned exactly once and cannot be recovered later because the server stores only
        its SHA-256 digest. If the client loses it, register a new device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
            example:
              email: owner@example.com
              password: correct horse battery staple
              name: Pixel Tablet Emulator
              platform: Android
      responses:
        "201":
          description: Device registered. Persist the returned token in secure client storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: The email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid_credentials
                message: email or password is incorrect
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listDevices
      tags: [Devices]
      summary: List every device registered to the authenticated account
      security:
        - deviceToken: []
      responses:
        "200":
          description: Registered devices, newest first. Revoked devices remain in the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDevicesResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/devices/{deviceID}:
    patch:
      operationId: renameDevice
      tags: [Devices]
      summary: Rename a registered device
      description: |
        The target must belong to the authenticated account and must not be revoked: a revoked row
        is history, and history that can be relabelled is worse than history. A device may rename
        itself.

        The name a client registers with is whatever it could work out about its own hardware, which
        is regularly not enough to tell two devices apart — two Android emulators built from
        different profiles report the same `Build.MODEL`, and so do two tablets of the same model.
        The field is a label for whoever is deciding which device to revoke, so this endpoint exists
        to let them write it.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameDeviceRequest"
      responses:
        "204":
          description: Device renamed. The response has no body.
        "400":
          description: The name is empty, too long, or holds a NUL character.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid_request
                message: a device name is required
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: No matching live device exists for the authenticated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: not_found
                message: no such device
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: revokeDevice
      tags: [Devices]
      summary: Revoke a registered device
      description: |
        The target must belong to the authenticated account. A device may revoke itself; its token
        becomes invalid on the next request. Re-revoking an already revoked device is successful.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "204":
          description: Device revoked. The response has no body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: No matching device exists for the authenticated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: not_found
                message: no such device
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/cursor:
    get:
      operationId: getCursor
      tags: [Sync]
      summary: Read the account's current change cursor
      description: |
        The idle poll. A client compares this value with its own stored cursor and pulls only when
        they differ, so a client with an empty outbox and nothing to fetch makes this one request
        per interval and stops. The server answers it with a single primary-key read.
      security:
        - deviceToken: []
      responses:
        "200":
          description: The account's current cursor. A brand new account is at 0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorResponse"
              example:
                cursor: 41
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/changes:
    get:
      operationId: pullChanges
      tags: [Sync]
      summary: Read the changes recorded after a cursor
      description: |
        Returns every change with a `seq` greater than `since`, oldest first and parents before
        children within each `seq`.

        A response never splits a push. Every entity a push accepted carries one `seq` value and
        arrives in one response, which makes `limit` a request rather than a hard cap: a single push
        larger than `limit` is still returned whole. Apply the whole response, then store `cursor`,
        then repeat while `hasMore` is true.

        The delta includes the calling device's own writes. That is deliberate — it is what lets a
        device whose push response was lost recover the authoritative row by pulling.
      security:
        - deviceToken: []
      parameters:
        - name: since
          in: query
          required: false
          description: Exclusive lower bound. Omit or send 0 for a first full synchronisation.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
          example: 41
        - name: limit
          in: query
          required: false
          description: Requested page size. Rounded up to the end of a `seq` when one straddles it.
          schema:
            type: integer
            minimum: 1
            maximum: 2048
            default: 512
      responses:
        "200":
          description: |
            The delta, possibly empty. An empty `changes` with a `cursor` above `since` cannot
            happen; a client that is ahead of the server receives the server's lower cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullChangesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: pushChanges
      tags: [Sync]
      summary: Apply a batch of local changes
      description: |
        Every change carries `baseVersion`, the version the client believes the server holds, where
        0 means "I believe this entity is new". A change applies only while that is still the stored
        version; otherwise it is rejected and the current server row travels back with the rejection
        so the client can resolve it without another round trip.

        The batch applies in one transaction. Everything it accepts receives one `seq`, so a page
        and the section it was moved into can never reach another device separately. Rejecting one
        entity does not fail the others: a change whose parent is unknown, whose version is stale,
        or which cannot be read is refused on its own.

        `batchId` is an idempotency key. Re-sending a batch under the same id within the server's
        replay window returns the original response instead of applying the work a second time,
        which is what makes a push safe to retry when its response was lost.

        Send at most 512 changes and 4 MB per request; paginate beyond that.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushChangesRequest"
            example:
              batchId: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
              changes:
                - kind: notebook
                  id: 0c8f1f1e-6d1a-4a5f-9f3e-2b1c8b6a9d10
                  baseVersion: 0
                  updatedAt: 1755300000000
                  name: Work
                  colorArgb: -16777216
                  sortIndex: 0
                  expanded: true
                  createdAt: 1755300000000
      responses:
        "200":
          description: |
            The batch was processed. A response with an empty `applied` and a populated `rejected`
            is a successful request describing a batch that changed nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushChangesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          description: The batch exceeds 4 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: payload_too_large
                message: request body is too large
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/blobs/{sha256}:
    head:
      operationId: checkBlob
      tags: [Attachments]
      summary: Ask whether the server already holds these bytes
      description: |
        The cheap half of deduplication, and the request a client makes before every upload. The
        same picture inserted on nine pages, or already uploaded from another device, costs one round
        trip instead of a second copy of the file.

        Presence means both that this account holds the digest and that the bytes are on disk. A
        server whose blob directory was lost answers 404 and the upload that repairs it follows,
        rather than reporting a picture it can no longer serve.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/BlobDigest"
      responses:
        "204":
          description: The account holds these bytes. Do not upload them again.
          headers:
            ETag:
              schema:
                type: string
              description: The digest, quoted.
            Cache-Control:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: The account does not hold these bytes. Upload them.
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: uploadBlob
      tags: [Attachments]
      summary: Upload attachment bytes under their digest
      description: |
        The body is the raw bytes, not JSON and not base64. They are hashed as they arrive and
        refused if they do not hash to the digest in the URL, so a body truncated in transit becomes
        a rejected upload rather than a stored file every device will fetch and fail to decode.

        Send `Expect: 100-continue`. The server answers 204 for a picture it already holds without
        waiting for the body, so a client that skipped the `HEAD` still does not transfer bytes
        twice.

        Uploading is idempotent: the same bytes under the same digest are stored once however many
        devices send them, and the response says which case it was.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/BlobDigest"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The bytes were stored. They can now be named by `blobRefs` and by an `attachment` id.
          headers:
            ETag:
              schema:
                type: string
        "204":
          description: The account already held these bytes; nothing was stored.
          headers:
            ETag:
              schema:
                type: string
        "400":
          description: |
            The digest is not 64 lowercase hex characters, or the bytes do not hash to it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid_request
                message: the uploaded bytes do not hash to the digest in the URL
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          description: |
            The attachment is larger than the per-attachment cap, 32 MiB by default. That cap is the
            only storage limit: there is no per-account quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: payload_too_large
                message: an attachment may not exceed 33554432 bytes
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: downloadBlob
      tags: [Attachments]
      summary: Download attachment bytes
      description: |
        Returns the bytes, with `Range`, `If-None-Match` and `If-Range` support: an interrupted
        download resumes rather than restarting, and a client that already has the picture pays a
        304. The response is `immutable` and may be cached for as long as the client likes, because
        content addressed by its own hash cannot change — a different byte would be a different URL.

        The media type is always `application/octet-stream`; the real one is on the `attachment` row
        the client pulled. Holding a digest is not holding a blob: only an account that has itself
        uploaded these bytes can read them.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/BlobDigest"
      responses:
        "200":
          description: The bytes.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range of the bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: |
            This account holds no such attachment. Also the answer when another account holds it, and
            when the row exists but its bytes do not — in the second case, uploading again repairs it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "416":
          description: The requested range lies outside the content.
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: vive_<base64url>
      description: Device token returned once by `POST /v1/devices`.

  parameters:
    BlobDigest:
      name: sha256
      in: path
      required: true
      description: |
        The SHA-256 of the bytes, as 64 lowercase hex characters. Uppercase is refused rather than
        folded: this string is an identity — it is also the attachment's id and its `blobRefs`
        entry — and two spellings of one identity is how one picture becomes two files.
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
      example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

    DeviceID:
      name: deviceID
      in: path
      required: true
      description: Server-assigned device UUID.
      schema:
        type: string
        format: uuid
      example: 7af9be36-8f89-4b31-bc78-3ef246837469

  responses:
    InvalidRequest:
      description: The JSON body or one of its fields is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_request
            message: request body is not valid JSON

    PayloadTooLarge:
      description: The authentication request exceeds 64 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: payload_too_large
            message: request body is too large

    Unauthenticated:
      description: A device token is missing, unknown, or revoked.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
          example: Bearer realm="vivecserver", error="invalid_token"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: unauthenticated
            message: unknown or revoked token

    InternalError:
      description: The server could not complete the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: internal
            message: something went wrong

  schemas:
    CreateAccountRequest:
      type: object
      additionalProperties: true
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Email addresses are trimmed and lowercased before storage.
          example: owner@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
          writeOnly: true

    CreateAccountResponse:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          type: string
          format: uuid
          example: a62c615f-5a73-47bb-b704-ad49cf527ec2

    RegisterDeviceRequest:
      type: object
      additionalProperties: true
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: owner@example.com
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Human-readable device name after trimming surrounding whitespace.
          example: Pixel Tablet Emulator
        platform:
          type: string
          maxLength: 64
          default: ""
          description: Optional platform label used only for display.
          example: Android

    RegisterDeviceResponse:
      type: object
      additionalProperties: false
      required: [deviceId, accountId, token]
      properties:
        deviceId:
          type: string
          format: uuid
          example: 7af9be36-8f89-4b31-bc78-3ef246837469
        accountId:
          type: string
          format: uuid
          example: a62c615f-5a73-47bb-b704-ad49cf527ec2
        token:
          type: string
          pattern: "^vive_[A-Za-z0-9_-]+$"
          description: Bearer credential returned only by this response. Store it securely.
          example: vive_c29tZS1leGFtcGxlLWRldmljZS10b2tlbg

    ListDevicesResponse:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    Device:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - name
        - platform
        - createdAt
        - lastPulledSeq
      properties:
        deviceId:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Omitted until the device first authenticates after registration.
        lastPulledSeq:
          type: integer
          format: int64
          minimum: 0
          description: Highest pull cursor later presented by the device as its `since` value, confirming that all changes through it were committed locally.
        revokedAt:
          type: string
          format: date-time
          description: Omitted for active devices.

    CursorResponse:
      type: object
      additionalProperties: false
      required: [cursor]
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 0
          description: The account's newest change sequence value.

    PullChangesResponse:
      type: object
      additionalProperties: false
      required: [changes, cursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        cursor:
          type: integer
          format: int64
          minimum: 0
          description: |
            Store this only after every change in the response has been applied. It is always a
            complete sequence boundary.
        hasMore:
          type: boolean
          description: True when more changes exist beyond `cursor`. Pull again immediately.

    PushChangesRequest:
      type: object
      additionalProperties: false
      required: [batchId, changes]
      properties:
        batchId:
          type: string
          format: uuid
          description: |
            Idempotency key. Generate one per batch and reuse it for every retry of that batch.
          example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        changes:
          type: array
          maxItems: 512
          items:
            $ref: "#/components/schemas/PushChange"

    PushChangesResponse:
      type: object
      additionalProperties: false
      required: [applied, rejected, cursor]
      properties:
        applied:
          type: array
          items:
            $ref: "#/components/schemas/AppliedChange"
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/RejectedChange"
        cursor:
          type: integer
          format: int64
          minimum: 0
          description: |
            The account's cursor after the batch, which for a batch that applied anything is the
            sequence value stamped on every entity it accepted. It is not a pull cursor: other
            devices' changes may sit below it.

    AppliedChange:
      type: object
      additionalProperties: false
      required: [kind, id, version]
      properties:
        kind:
          $ref: "#/components/schemas/EntityKind"
        id:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
          description: The stored version now. Send it as `baseVersion` on the next edit.

    RejectedChange:
      type: object
      additionalProperties: false
      required: [kind, id, reason]
      properties:
        kind:
          type: string
          description: The kind the client sent, which for an unrecognised kind is not in EntityKind.
        id:
          type: string
        reason:
          $ref: "#/components/schemas/RejectionReason"
        message:
          type: string
          description: Human-readable detail. Client logic must branch on `reason`, not this field.
        current:
          $ref: "#/components/schemas/Change"

    RejectionReason:
      type: string
      description: |
        `version_conflict` — the entity moved on, or the server has never held it; `current` carries
        the stored row when there is one, and is absent when there is not.
        `missing_parent` — the notebook or section it belongs to has not been uploaded. Push the
        parent, then retry this entity.
        `too_large` — a field is longer than the limit `.vive` bundles use for the same field.
        `missing_blob` — the change names an attachment whose bytes the server does not hold. Upload
        them to `/v1/blobs/{sha256}` and push the change again. It is the one rejection a client can
        always clear on its own. A tombstone is never rejected for this: deleting a row whose bytes
        have already gone is exactly how a picture stops existing.
        `malformed` — the change could not be read as the kind it claims to be, its id is unusable,
        the same entity appeared twice in one batch, an `attachment` declares a `byteCount` that is
        not the size of the blob its id names, or the kind is one this server does not know.
      enum:
        - version_conflict
        - missing_parent
        - missing_blob
        - too_large
        - malformed

    EntityKind:
      type: string
      description: |
        Synced entity kinds, in apply order: a parent is always applied and emitted before its
        children. `attachment` is last and has no parent — one picture can appear on several pages,
        so there is no page that owns it.
      enum:
        - notebook
        - section
        - page
        - pageContent
        - inkStroke
        - inkErase
        - inkMove
        - attachment

    ChangeEnvelope:
      type: object
      required: [kind, id, version, seq, updatedAt]
      properties:
        kind:
          $ref: "#/components/schemas/EntityKind"
        id:
          type: string
          maxLength: 512
          description: Client-generated and stable for the life of the entity.
        version:
          type: integer
          format: int64
          minimum: 1
          description: Server-assigned, incremented on every accepted write.
        seq:
          type: integer
          format: int64
          minimum: 1
          description: The account sequence value this write was stamped with.
        deletedAt:
          type: [integer, "null"]
          format: int64
          description: |
            Tombstone timestamp in client epoch milliseconds, or null. A deleted entity keeps all of
            its other fields; it is not removed from the delta.
        updatedAt:
          type: integer
          format: int64
          description: |
            The writing client's wall clock in epoch milliseconds. Convergence never depends on it;
            it is for display and for the client's own merge heuristics.

    PushChangeEnvelope:
      type: object
      required: [kind, id, baseVersion, updatedAt]
      properties:
        kind:
          $ref: "#/components/schemas/EntityKind"
        id:
          type: string
          maxLength: 512
        baseVersion:
          type: integer
          format: int64
          minimum: 0
          description: |
            The version the client believes the server holds. 0 asserts the entity is new; a stored
            entity then rejects with `version_conflict` and its current state, which is also how a
            client that lost its local state recovers.
        deletedAt:
          type: [integer, "null"]
          format: int64
          description: Set to delete. Send the entity's other fields as they stand locally.
        updatedAt:
          type: integer
          format: int64

    Change:
      description: |
        One stored entity as the server returns it.

        Properties beyond those described here are preserved: a field a newer client sends that this
        server has no column for is stored verbatim and returned at the top level unchanged. A
        client must therefore never reject a change for carrying a field it does not recognise, and
        must never treat this schema as closed.
      oneOf:
        - $ref: "#/components/schemas/NotebookChange"
        - $ref: "#/components/schemas/SectionChange"
        - $ref: "#/components/schemas/PageChange"
        - $ref: "#/components/schemas/PageContentChange"
        - $ref: "#/components/schemas/InkStrokeChange"
        - $ref: "#/components/schemas/InkEraseChange"
        - $ref: "#/components/schemas/InkMoveChange"
        - $ref: "#/components/schemas/AttachmentChange"
      discriminator:
        propertyName: kind
        mapping:
          notebook: "#/components/schemas/NotebookChange"
          section: "#/components/schemas/SectionChange"
          page: "#/components/schemas/PageChange"
          pageContent: "#/components/schemas/PageContentChange"
          inkStroke: "#/components/schemas/InkStrokeChange"
          inkErase: "#/components/schemas/InkEraseChange"
          inkMove: "#/components/schemas/InkMoveChange"
          attachment: "#/components/schemas/AttachmentChange"

    PushChange:
      description: |
        One entity as the client sends it. Unrecognised properties are accepted and stored, subject
        to a 16 KiB limit per entity.
      oneOf:
        - $ref: "#/components/schemas/NotebookPush"
        - $ref: "#/components/schemas/SectionPush"
        - $ref: "#/components/schemas/PagePush"
        - $ref: "#/components/schemas/PageContentPush"
        - $ref: "#/components/schemas/InkStrokePush"
        - $ref: "#/components/schemas/InkErasePush"
        - $ref: "#/components/schemas/InkMovePush"
        - $ref: "#/components/schemas/AttachmentPush"
      discriminator:
        propertyName: kind
        mapping:
          notebook: "#/components/schemas/NotebookPush"
          section: "#/components/schemas/SectionPush"
          page: "#/components/schemas/PagePush"
          pageContent: "#/components/schemas/PageContentPush"
          inkStroke: "#/components/schemas/InkStrokePush"
          inkErase: "#/components/schemas/InkErasePush"
          inkMove: "#/components/schemas/InkMovePush"
          attachment: "#/components/schemas/AttachmentPush"

    NotebookFields:
      type: object
      additionalProperties: true
      required: [name, colorArgb, sortIndex, expanded, createdAt]
      properties:
        name:
          type: string
          maxLength: 512
        colorArgb:
          type: integer
          format: int32
        sortIndex:
          type: integer
          format: int32
        expanded:
          type: boolean
          description: Rail expansion state. Synced for now because it lives on the entity.
        createdAt:
          type: integer
          format: int64

    SectionFields:
      type: object
      additionalProperties: true
      required: [notebookId, name, colorArgb, sortIndex, createdAt]
      properties:
        notebookId:
          type: string
          maxLength: 512
          description: Must already exist on the account, or arrive earlier in the same batch.
        name:
          type: string
          maxLength: 512
        colorArgb:
          type: integer
          format: int32
        sortIndex:
          type: integer
          format: int32
        createdAt:
          type: integer
          format: int64

    PageFields:
      type: object
      additionalProperties: true
      required: [sectionId, title, sortIndex, preview, createdAt]
      properties:
        sectionId:
          type: string
          maxLength: 512
          description: Must already exist on the account, or arrive earlier in the same batch.
        title:
          type: string
          maxLength: 512
        sortIndex:
          type: integer
          format: int32
        preview:
          type: string
          maxLength: 4096
          description: Denormalised first line of body text, carried by the page so that listing a section never loads a document. The document itself is the `pageContent` kind.
        createdAt:
          type: integer
          format: int64

    PageContentFields:
      type: object
      additionalProperties: true
      required: [pageId, doc, format]
      properties:
        pageId:
          type: string
          maxLength: 512
          description: |
            The page this body belongs to, which must already exist on the account or arrive earlier
            in the same batch. One body per page is enforced by the server; a client addresses a body
            by its page's id.
        doc:
          type: string
          format: byte
          description: |
            The document, base64 encoded, opaque to the server. At most 2 MiB before encoding — a
            larger one is rejected `too_large`, because a batch is capped at 4 MB and base64 costs a
            third on top of the bytes.
        docSha256:
          type: string
          format: byte
          description: |
            SHA-256 of `doc`, base64 encoded. Optional on a push and always present on a pull. When a
            push carries one it is verified rather than trusted, and a body that disagrees with it is
            rejected `malformed`; the stored digest is always recomputed from the bytes that arrived.
        format:
          type: string
          maxLength: 128
          description: Id of the codec that wrote `doc`, per row, so the format can change without rewriting every document. `json/1` today.
        enc:
          type: string
          maxLength: 128
          description: How `doc` is wrapped before storage. Absent means `none/1`, which is what the server returns.
        blobRefs:
          type: array
          maxItems: 512
          items:
            type: string
            pattern: "^[0-9a-f]{64}$"
          description: |
            The attachment digests this document references, extracted by the client while pushing.

            The server cannot read `doc`, so this is the only way it can know which pictures a page
            still shows — and therefore the only way it can ever free one. Every push replaces the
            whole set, so removing a picture from a page is enough to release it.

            **Upload the bytes first.** A push naming a digest the server does not hold is rejected
            `missing_blob` and nothing is stored, which is what makes it impossible for the server to
            hold a reference it cannot satisfy. Absent and empty mean the same thing, and a pull
            always returns an array.

    InkStrokeFields:
      type: object
      additionalProperties: true
      required: [pageId, drawOrder, brushFamily, brushVersion, sizeDp, colorArgb, epsilon, stabilization, minX, minY, maxX, maxY, points, createdAt]
      description: |
        One stroke. Immutable in everything that draws it — points, brush, bounds — with a small
        mutable envelope: `deletedAt` (an erase tombstones a stroke, an undo clears it again),
        `colorArgb` with `colorFollowsTheme`, and `groupId`. Those take the ordinary optimistic
        concurrency path like any other kind; there is no insert-only fast path for ink, because one
        would silently drop both an erase and the undo of one.
      properties:
        pageId:
          type: string
          maxLength: 512
          description: The page this stroke is on, which must already exist on the account or arrive earlier in the same batch.
        drawOrder:
          type: integer
          format: int32
          minimum: 0
          description: |
            Draw order within the page — later strokes paint on top — and a page-scoped Lamport
            clock rather than a count. A client allocates `max(seq) + 1` over every stroke it holds,
            including ones pulled from other devices, so a stroke is always numbered above everything
            that device has seen. **It is not unique and not dense**: two devices drawing offline on
            one page allocate the same value, which is correct, and the tie is broken by ascending
            `id`. Named `drawOrder` and not `seq` because `seq` is the envelope's account sequence;
            a client sending it under that name would have it dropped as an envelope field.
        brushFamily:
          type: string
          maxLength: 128
          description: Stock brush id — `marker`, `pressure-pen`, `highlighter`, `dashed-line`.
        brushVersion:
          type: integer
          format: int32
          description: Pinned at creation, never "latest", so a brush that gains a V2 cannot restyle old ink.
        sizeDp:
          type: number
          format: float
        colorArgb:
          type: integer
          format: int32
        colorFollowsTheme:
          type: [boolean, "null"]
          description: |
            Whether `colorArgb` was the automatic colour rather than one the user picked, so Switch
            Background can re-resolve it. Absent or null on a stroke drawn before the app recorded
            the intent — a third state, not a default.
        epsilon:
          type: number
          format: float
          description: Mesh tolerance the stroke was built with, which pins its fidelity across library versions.
        stabilization:
          type: integer
          format: int32
          description: The pen's stabilization level when drawn, 0-5. Per stroke rather than per pen, because a stroke has to come back looking like the stroke that was drawn.
        minX:
          type: number
          format: float
        minY:
          type: number
          format: float
        maxX:
          type: number
          format: float
        maxY:
          type: number
          format: float
        points:
          type: string
          format: byte
          description: |
            The encoded input points, base64, opaque to the server. At most 4 MiB before encoding,
            matching what a `.vive` bundle accepts; a batch is capped at 4 MB, so anything near this
            can only travel alone.
        enc:
          type: string
          maxLength: 128
          description: Id of the encoder that wrote `points`. Absent means `ink/v1`, which is what the server returns.
        createdAt:
          type: integer
          format: int64
        groupId:
          type: [string, "null"]
          maxLength: 512
          description: Optional logical object group. Geometry stays immutable when membership changes.

    InkOperationTargets:
      type: object
      properties:
        targetIds:
          type: array
          maxItems: 100000
          items:
            type: string
            maxLength: 512
          description: |
            The strokes this operation was allowed to affect, carried inside the operation and
            replaced wholesale — never a separate change record. The mask without its targets would
            be unsafe: replayed against every stroke on the page it would also erase ink drawn later.

            These are **inert ids, not references**. An id naming no stored stroke is normal and must
            stay harmless: a target recoloured after the operation was made reaches a client in a
            later delta page than the operation naming it, and a target the client's own retention
            has purged never arrives at all. A client that enforced them would stall its cursor
            permanently on either case.

    InkEraseFields:
      type: object
      additionalProperties: true
      required: [pageId, mode, sizeDp, points, createdAt]
      description: One eraser gesture, stored so it can be replayed rather than applied to the strokes it cuts.
      properties:
        pageId:
          type: string
          maxLength: 512
        mode:
          type: string
          maxLength: 128
          description: |
            `Normal` subtracts the mask; `Object` removes every disconnected component it touches.
            Stored as text and never checked against a list, so a new eraser mode does not need a
            server deploy before it can be stored.
        sizeDp:
          type: number
          format: float
          description: Eraser diameter in page dp.
        points:
          type: string
          format: byte
          description: The mask's encoded input path, base64, opaque to the server.
        enc:
          type: string
          maxLength: 128
        createdAt:
          type: integer
          format: int64

    InkMoveFields:
      type: object
      additionalProperties: true
      required: [pageId, dxDp, dyDp, points, createdAt]
      description: |
        One lasso transform, stored as its polygon and affine parameters rather than applied. The
        strokes it moves are immutable: rewriting their points would invalidate every stored lasso
        path that references the originals, and would put the whole selection back on the wire.
      properties:
        pageId:
          type: string
          maxLength: 512
        dxDp:
          type: number
          format: float
        dyDp:
          type: number
          format: float
        scaleX:
          type: number
          format: float
          description: Optional resize composed after the translation. A plain move stores 1.
        scaleY:
          type: number
          format: float
        anchorX:
          type: number
          format: float
          description: Page-space anchor the resize is taken around.
        anchorY:
          type: number
          format: float
        points:
          type: string
          format: byte
          description: The closed lasso polygon in page coordinates, base64, opaque to the server.
        enc:
          type: string
          maxLength: 128
        createdAt:
          type: integer
          format: int64

    AttachmentFields:
      type: object
      additionalProperties: true
      required: [mimeType, pixelWidth, pixelHeight, byteCount, createdAt]
      description: |
        What is known about a picture. The pixels are not here and never travel through the change
        protocol: they are uploaded to `/v1/blobs/{sha256}` first, and this row is rejected
        `missing_blob` until they are.

        **The entity id is the digest of the bytes** — the same lowercase hex SHA-256 that names the
        blob and appears in `blobRefs`. There is deliberately no `sha256` field: a second place to
        write an identity is a first opportunity for the two to disagree.

        There is no `pageId`, because one picture can appear on several pages, and no `refCount`,
        because reachability is a per-device count and each device computes its own.
      properties:
        mimeType:
          type: string
          maxLength: 255
          description: Stored and returned, never dispatched on. Downloads are always `application/octet-stream`.
        pixelWidth:
          type: integer
          format: int32
          minimum: 0
          description: Dimensions of what was stored, after the client's import re-encode. Layout metadata; the server never decodes the picture.
        pixelHeight:
          type: integer
          format: int32
          minimum: 0
        byteCount:
          type: integer
          format: int64
          minimum: 0
          description: |
            The size of the bytes. Checked against the stored blob on every push and rejected
            `malformed` if it disagrees, the same way a document body that disagrees with its digest
            is: a row that misdescribes what it names is the quiet kind of corruption.
        createdAt:
          type: integer
          format: int64

    NotebookChange:
      allOf:
        - $ref: "#/components/schemas/ChangeEnvelope"
        - $ref: "#/components/schemas/NotebookFields"

    SectionChange:
      allOf:
        - $ref: "#/components/schemas/ChangeEnvelope"
        - $ref: "#/components/schemas/SectionFields"

    PageChange:
      allOf:
        - $ref: "#/components/schemas/ChangeEnvelope"
        - $ref: "#/components/schemas/PageFields"

    PageContentChange:
      allOf:
        - $ref: "#/components/schemas/ChangeEnvelope"
        - $ref: "#/components/schemas/PageContentFields"

    InkStrokeChange:
      allOf:
        - $ref: "#/components/schemas/ChangeEnvelope"
        - $ref: "#/components/schemas/InkStrokeFields"

    InkEraseChange:
      allOf:
        - $ref: "#/components/schemas/ChangeEnvelope"
        - $ref: "#/components/schemas/InkEraseFields"
        - $ref: "#/components/schemas/InkOperationTargets"

    InkMoveChange:
      allOf:
        - $ref: "#/components/schemas/ChangeEnvelope"
        - $ref: "#/components/schemas/InkMoveFields"
        - $ref: "#/components/schemas/InkOperationTargets"

    AttachmentChange:
      allOf:
        - $ref: "#/components/schemas/ChangeEnvelope"
        - $ref: "#/components/schemas/AttachmentFields"

    NotebookPush:
      allOf:
        - $ref: "#/components/schemas/PushChangeEnvelope"
        - $ref: "#/components/schemas/NotebookFields"

    SectionPush:
      allOf:
        - $ref: "#/components/schemas/PushChangeEnvelope"
        - $ref: "#/components/schemas/SectionFields"

    PagePush:
      allOf:
        - $ref: "#/components/schemas/PushChangeEnvelope"
        - $ref: "#/components/schemas/PageFields"

    PageContentPush:
      allOf:
        - $ref: "#/components/schemas/PushChangeEnvelope"
        - $ref: "#/components/schemas/PageContentFields"

    InkStrokePush:
      allOf:
        - $ref: "#/components/schemas/PushChangeEnvelope"
        - $ref: "#/components/schemas/InkStrokeFields"

    InkErasePush:
      allOf:
        - $ref: "#/components/schemas/PushChangeEnvelope"
        - $ref: "#/components/schemas/InkEraseFields"
        - $ref: "#/components/schemas/InkOperationTargets"

    InkMovePush:
      allOf:
        - $ref: "#/components/schemas/PushChangeEnvelope"
        - $ref: "#/components/schemas/InkMoveFields"
        - $ref: "#/components/schemas/InkOperationTargets"

    AttachmentPush:
      allOf:
        - $ref: "#/components/schemas/PushChangeEnvelope"
        - $ref: "#/components/schemas/AttachmentFields"

    RenameDeviceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Trimmed before storage. What the device list will show for this device.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable detail. Client logic must branch on `error`, not this field.

    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_credentials
        - signup_closed
        - email_taken
        - unauthenticated
        - not_found
        - payload_too_large
        - internal

    HealthyStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    UnavailableStatus:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          const: unavailable
        reason:
          type: string
          const: database
