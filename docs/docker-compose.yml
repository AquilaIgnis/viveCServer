# User-facing self-hosting stack using the published application image.
#
#   cp env.example .env
#   docker compose up -d
#   open http://localhost:8080
#
# Keep VIVE_POSTGRES_PASSWORD URL-safe because Compose interpolates it into the
# application database URL below.
name: vivecserver

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${VIVE_POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  vivecserver:
    image: acidburnmonkey/vive-cserver:latest
    environment:
      VIVE_DATABASE_URL: ${VIVE_DATABASE_URL}
      VIVE_LOG_LEVEL: ${VIVE_LOG_LEVEL}
    ports:
      - "8080:8080" # admin panel
      - "5444:8281" # sync port
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    restart: unless-stopped
